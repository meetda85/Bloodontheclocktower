name: Deploy to GitHub Pages

on:
  push:
    # GitHub Pages solo admite despliegues desde la rama por defecto del
    # repositorio, que aquí es la rama de trabajo de Claude.
    branches: [main, master, 'claude/spotify-blood-clock-tower-app-cic5b5']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
