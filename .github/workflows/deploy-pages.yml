name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Sin cancelar: si llegan dos pushes a la vez (rama de trabajo y main), el
  # segundo esperaría su turno en vez de abortar el despliegue que va en serio.
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Pages solo acepta despliegues desde la rama por defecto del
    # repositorio; desde cualquier otra, el entorno los rechaza al instante.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
